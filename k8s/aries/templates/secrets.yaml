{{- if .Values.registry.create }}
{{- if not .Values.registry.dockerconfigjson }}
{{- fail "registry.create is true but registry.dockerconfigjson is empty: set it in secret.yaml, or set registry.create=false for a public image" }}
{{- end }}
# Registry credentials for images in a private registry. Profiles reference this
# Secret by name through image_pull_secret, so the name is load-bearing.
apiVersion: v1
kind: Secret
metadata:
  name: aries-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aries.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |-
    {{- .Values.registry.dockerconfigjson | toString | nindent 4 }}
{{- end }}
