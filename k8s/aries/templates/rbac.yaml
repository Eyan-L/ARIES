{{- if .Values.rbac.create }}
# Permissions ARIES needs to act as the Tool Sandbox owner on Kubernetes:
# create/manage the per-task sandbox pods, exec into them, and stream their
# logs. Scoped to the release namespace (Role, not ClusterRole) so ARIES cannot
# touch workloads elsewhere in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aries.fullname" . }}-sandbox
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aries.labels" . | nindent 4 }}
rules:
  # Harness, sandbox and bridge pods: one per runtime, created and deleted by
  # the runner. `watch` backs `kubectl wait`.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # exec stages files and runs commands; portforward reaches the harness
  # gateway and the bridge's control port from outside the cluster.
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # One policy per sandbox, plus one per run for the bridge.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aries.fullname" . }}-sandbox
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aries.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aries.fullname" . }}-sandbox
subjects:
  - kind: ServiceAccount
    name: {{ include "aries.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.rbac.create .Values.rbac.nodeMetrics }}
---
# Pod resource telemetry reads the kubelet Summary API through the API server
# proxy (/api/v1/nodes/<node>/proxy/stats/summary), which reports the cumulative
# usageCoreNanoSeconds counter pkg/monitor needs. `nodes` is a cluster-scoped
# resource, so this cannot be folded into the namespaced Role above.
#
# This is the one privilege ARIES holds outside its own namespace. It is
# read-only and confined to a single subresource: `get` on nodes/proxy permits
# reading kubelet endpoints, and nothing else — no node mutation, and no access
# to workloads in other namespaces. Set rbac.nodeMetrics=false if you do not
# want pod telemetry; the sandbox and harness still work, and resources.jsonl is
# simply empty.
#
# These two are cluster-scoped, so their names are global. Two releases in
# different namespaces would fight over them: give each a distinct
# fullnameOverride.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aries.fullname" . }}-node-metrics
  labels:
    {{- include "aries.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aries.fullname" . }}-node-metrics
  labels:
    {{- include "aries.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aries.fullname" . }}-node-metrics
subjects:
  - kind: ServiceAccount
    name: {{ include "aries.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
