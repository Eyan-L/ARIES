# The ARIES runner in a container, for hosts that cannot build or run bin/aries
# natively, such as macOS.
#
#   docker compose -f docker/docker-compose.yml run --rm aries
#
# The runner starts harness, sandbox and tool bridge containers as siblings
# through the mounted Docker socket. See docker/README.md.
name: aries

services:
  aries:
    build:
      context: ..
      dockerfile: Dockerfile
    image: aries:latest
    container_name: aries
    # The runner reaches the harness gateway and the bridge's control port on
    # ports published to host loopback.
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The model key, read-only. Compose refuses to start without the file
      # instead of creating an empty directory in its place.
      - type: bind
        source: ../DEEPSEEK_API.key
        target: /app/DEEPSEEK_API.key
        read_only: true
        bind:
          create_host_path: false
      - ../profiles:/app/profiles:ro
      - ../configs:/app/configs:ro
      - ../runs:/app/runs
      - aries-cache:/app/.cache
    command: ["${PROFILE:-profiles/openclaw-tb2-fix-git-deepseek.json}"]

volumes:
  aries-cache:
