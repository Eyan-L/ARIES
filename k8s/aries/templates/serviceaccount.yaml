{{- if .Values.serviceAccount.create }}
# The runner's identity. The runner is a host process, so nothing mounts this
# account; instead `k8s/apply-aries.sh --runner-kubeconfig` builds a kubeconfig
# from the token Secret below. That keeps the runner on the namespaced Role in
# rbac.yaml rather than on a cluster-admin kubeconfig.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aries.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aries.labels" . | nindent 4 }}
---
# A long-lived token for that account, filled in by the token controller. It is
# long-lived on purpose: a run can outlast a `kubectl create token` expiry, and
# a token expiring mid-task would leave revocation unconfirmable. Delete this
# Secret to revoke the runner's access; a new one is created on the next
# upgrade.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aries.serviceAccountName" . }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aries.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "aries.serviceAccountName" . }}
type: kubernetes.io/service-account-token
{{- end }}
